name: Apply infra

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/apply-infra.yml
  workflow_dispatch:

concurrency:
  group: apply-infra
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # Adds a manual approval gate. Create the "production" environment in
    # GitHub repo settings → Environments and add yourself as a required
    # reviewer. Until you click approve in the Actions UI, terraform apply
    # waits.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::387219500825:role/github-actions-deploy
          aws-region: ap-southeast-1

      - name: Init
        run: terraform init -input=false
        working-directory: infra

      - name: Plan
        run: terraform plan -no-color -input=false -out=plan.tfplan
        working-directory: infra

      - name: Apply
        run: terraform apply -input=false -auto-approve plan.tfplan
        working-directory: infra
