name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - apps/server/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::387219500825:role/github-actions-deploy
          aws-region: ap-southeast-1

      - name: Find instance ID by tag
        id: ec2
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=caphne-prod-v6" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Instance: $ID"

      - name: Trigger redeploy on the EC2 via SSM
        id: ssm
        run: |
          CMD=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters 'commands=[
              "set -euxo pipefail",
              "cd /opt/caphne",
              "sudo -u ubuntu git fetch --all",
              "sudo -u ubuntu git reset --hard origin/main",
              "sudo -u ubuntu pnpm install --frozen-lockfile",
              "sudo -u ubuntu pnpm --filter server build",
              "sudo systemctl restart caphne",
              "sleep 3",
              "systemctl is-active caphne",
              "curl -sf http://localhost:8080/health"
            ]' \
            --query 'Command.CommandId' --output text)
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "Command: $CMD"

      - name: Wait for SSM command to finish
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.cmd }}" \
            --instance-id "${{ steps.ec2.outputs.id }}"

      - name: Print SSM command output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.cmd }}" \
            --instance-id "${{ steps.ec2.outputs.id }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
