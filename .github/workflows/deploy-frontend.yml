name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - apps/client/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch: # lets you trigger manually from the Actions tab

concurrency:
  group: deploy-frontend
  cancel-in-progress: false # never cancel an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm --filter client generate
        env:
          NUXT_PUBLIC_API_BASE: https://api.caphne.co

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::387219500825:role/github-actions-deploy
          aws-region: ap-southeast-1

      - name: Sync to S3
        run: |
          aws s3 sync apps/client/.output/public/ s3://caphne-frontend/ --delete

      - name: Invalidate CloudFront cache
        run: |
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id E2NI2OUQXGO5W8 \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation: $INV_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id E2NI2OUQXGO5W8 \
            --id "$INV_ID"
