name: PR checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

# Lets only one run of this workflow per branch run at a time. If you push
# twice in quick succession, the older run cancels.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  build-client:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter client generate
        env:
          NUXT_PUBLIC_API_BASE: https://api.caphne.co

  build-server:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server build

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    # Only run when infra files actually change in the PR
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.changed_files, 'infra/')
    # OIDC needs id-token write
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::387219500825:role/github-actions-deploy
          aws-region: ap-southeast-1

      - name: Init
        run: terraform init
        working-directory: infra

      - name: Plan
        id: plan
        run: terraform plan -no-color -input=false
        working-directory: infra

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const output = `### Terraform plan
            <details><summary>Show output</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout || 'plan failed — check the logs' }}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
