name: Terraform plan

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/pr-infra-plan.yml

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    # OIDC needs id-token write; pull-requests write lets us post the comment.
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::387219500825:role/github-actions-deploy
          aws-region: ap-southeast-1

      - name: Init
        run: terraform init -input=false
        working-directory: infra

      - name: Plan
        id: plan
        # Don't fail the job here — we want the comment to post first, then
        # fail explicitly at the end if the plan errored.
        continue-on-error: true
        run: terraform plan -no-color -input=false
        working-directory: infra

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const output = `### Terraform plan
            <details><summary>Show output</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout || 'plan failed — check the logs' }}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
