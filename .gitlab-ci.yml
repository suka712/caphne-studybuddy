# GitLab CI — mirrors the GitHub Actions workflows.
#   checks           ← pr-checks.yml        (lint + build, on MRs)
#   plan             ← pr-infra-plan.yml    (terraform plan, on MRs touching infra/**)
#   apply            ← apply-infra.yml      (terraform apply, manual, on main)
#   deploy-frontend  ← deploy-frontend.yml  (build + S3 sync + CF invalidate, on main)
#   deploy-backend   ← deploy-backend.yml   (SSM redeploy on the EC2, on main)
#
# All AWS access uses GitLab OIDC → assumes the ci-deploy role. Requires the
# AWS_ROLE_ARN CI/CD variable (unprotected).

stages:
  - checks
  - plan
  - apply
  - deploy

# Run pipelines for merge requests and for the default branch. MR pipelines
# carry the checks + terraform plan; main pipelines carry apply + deploys.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Shared AWS OIDC auth. GitLab issues a per-job OIDC token; we write it to a
# file and the AWS SDK/CLI assumes the role natively via AWS_ROLE_ARN +
# AWS_WEB_IDENTITY_TOKEN_FILE. Each job still writes the token in before_script
# (before_script doesn't merge across extends).
# ---------------------------------------------------------------------------
.aws-oidc:
  variables:
    AWS_DEFAULT_REGION: ap-southeast-1
    AWS_ROLE_SESSION_NAME: gitlab-ci
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/gitlab_oidc_token
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com

# ---------------------------------------------------------------------------
# Node checks (mirror of .github/workflows/pr-checks.yml)
# ---------------------------------------------------------------------------
.node:
  image: node:24-slim
  before_script:
    - npm install -g pnpm@10
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:
  stage: checks
  extends: .node
  script:
    - pnpm -r lint

build-client:
  stage: checks
  extends: .node
  variables:
    NUXT_PUBLIC_API_BASE: https://api.caphne.co
  script:
    - pnpm --filter client generate

build-server:
  stage: checks
  extends: .node
  script:
    - pnpm --filter server build

# ---------------------------------------------------------------------------
# Terraform (mirror of apply-infra.yml + pr-infra-plan.yml)
# ---------------------------------------------------------------------------
.terraform:
  extends: .aws-oidc
  image:
    name: hashicorp/terraform:1.15.6
    entrypoint: [""]
  before_script:
    - echo "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - cd infra
    - terraform init -input=false

tf-plan:
  stage: plan
  extends: .terraform
  script:
    - apk add --no-cache jq
    - terraform plan -input=false -out=plan.tfplan
    # Convert the plan into the JSON summary GitLab renders in the MR widget.
    - terraform show -json plan.tfplan > plan.show.json
    - |
      jq -r '([.resource_changes[]?.change.actions?] | flatten)
        | {"create": (map(select(.=="create")) | length),
           "update": (map(select(.=="update")) | length),
           "delete": (map(select(.=="delete")) | length)}' plan.show.json > plan.json
  artifacts:
    paths:
      - infra/plan.tfplan
    reports:
      terraform: infra/plan.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - infra/**/*

tf-apply:
  stage: apply
  extends: .terraform
  # Manual gate = the GitHub `environment: production` approval. Protect the
  # `production` environment in Settings → CI/CD → Environments to require an
  # approver before this can run.
  environment:
    name: production
  script:
    - terraform plan -input=false -out=plan.tfplan
    - terraform apply -input=false plan.tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - infra/**/*
      when: manual

# ---------------------------------------------------------------------------
# App deploys (mirror of deploy-frontend.yml + deploy-backend.yml)
# resource_group = the GitHub `concurrency` group: one deploy at a time.
# ---------------------------------------------------------------------------
deploy-frontend:
  stage: deploy
  extends: .aws-oidc
  image: node:24-slim
  resource_group: deploy-frontend
  variables:
    NUXT_PUBLIC_API_BASE: https://api.caphne.co
  before_script:
    - echo "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - apt-get update -qq && apt-get install -y -qq awscli
    - npm install -g pnpm@10
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter client generate
    - aws s3 sync apps/client/.output/public/ "s3://caphne-frontend-bucket/" --delete
    - |
      INV=$(aws cloudfront create-invalidation \
        --distribution-id E2NI2OUQXGO5W8 --paths '/*' \
        --query 'Invalidation.Id' --output text)
      echo "Invalidation: $INV"
      aws cloudfront wait invalidation-completed \
        --distribution-id E2NI2OUQXGO5W8 --id "$INV"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/client/**/*
        - packages/shared/**/*
        - pnpm-lock.yaml

deploy-backend:
  stage: deploy
  extends: .aws-oidc
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  resource_group: deploy-backend
  before_script:
    - echo "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
  script:
    - |
      ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=caphne-prod-v6" \
                  "Name=instance-state-name,Values=running" \
        --query 'Reservations[].Instances[].InstanceId | [0]' --output text)
      echo "Instance: $ID"
    # NOTE: this does `git reset --hard origin/main` on the EC2. The instance's
    # `origin` remote MUST point at GitLab (the source of truth). With the
    # GitLab-web-merge + dual-push topology, GitHub lags after a web merge, so
    # if the EC2 still pulls GitHub it can deploy STALE code. Verify/repoint.
    - |
      CMD=$(aws ssm send-command \
        --instance-ids "$ID" \
        --document-name "AWS-RunShellScript" \
        --comment "Deploy $CI_COMMIT_SHORT_SHA" \
        --parameters 'commands=["set -eux","cd /opt/caphne","sudo -u ubuntu git fetch --all","sudo -u ubuntu git reset --hard origin/main","sudo -u ubuntu pnpm install --frozen-lockfile","sudo -u ubuntu pnpm --filter server build","sudo systemctl restart caphne","sleep 3","systemctl is-active caphne","curl -sf http://localhost:8080/health"]' \
        --query 'Command.CommandId' --output text)
      echo "Command: $CMD"
    - aws ssm wait command-executed --command-id "$CMD" --instance-id "$ID" || true
    - |
      aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
        --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
        --output json
    - |
      STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
        --query 'Status' --output text)
      echo "Final status: $STATUS"
      test "$STATUS" = "Success"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/server/**/*
        - packages/shared/**/*
        - pnpm-lock.yaml
