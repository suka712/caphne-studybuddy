# GitLab CI — mirrors the GitHub Actions workflows.
#   checks  ← pr-checks.yml        (lint + build, on merge requests)
#   plan    ← pr-infra-plan.yml    (terraform plan, on MRs touching infra/**)
#   apply   ← apply-infra.yml      (terraform apply, manual, on main)
#
# App deploys (deploy-frontend / deploy-backend) are NOT here yet — only infra.

stages:
  - checks
  - plan
  - apply

# Run pipelines for merge requests and for the default branch. MR pipelines
# carry the checks + terraform plan; the main pipeline carries terraform apply.
# This mirrors the GitHub triggers (pull_request + push-to-main).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Node checks (mirror of .github/workflows/pr-checks.yml)
# ---------------------------------------------------------------------------
.node:
  image: node:24-slim
  before_script:
    - npm install -g pnpm@10
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:
  stage: checks
  extends: .node
  script:
    - pnpm -r lint

build-client:
  stage: checks
  extends: .node
  variables:
    NUXT_PUBLIC_API_BASE: https://api.caphne.co
  script:
    - pnpm --filter client generate

build-server:
  stage: checks
  extends: .node
  script:
    - pnpm --filter server build

# ---------------------------------------------------------------------------
# Terraform (mirror of apply-infra.yml + pr-infra-plan.yml)
#
# Auth: GitLab issues an OIDC token per job; we write it to a file and let the
# AWS provider assume the role natively via AWS_ROLE_ARN + web-identity token —
# no AWS CLI needed. Set AWS_ROLE_ARN as a CI/CD variable in project settings.
# State is the existing S3 backend (infra/state.tf), unchanged.
# ---------------------------------------------------------------------------
.terraform:
  image:
    name: hashicorp/terraform:1.15.6
    entrypoint: [""]
  variables:
    AWS_DEFAULT_REGION: ap-southeast-1
    AWS_ROLE_SESSION_NAME: gitlab-ci
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/gitlab_oidc_token
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - echo "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - cd infra
    - terraform init -input=false

tf-plan:
  stage: plan
  extends: .terraform
  script:
    - apk add --no-cache jq
    - terraform plan -input=false -out=plan.tfplan
    # Convert the plan into the JSON summary GitLab renders in the MR widget.
    - terraform show -json plan.tfplan > plan.show.json
    - |
      jq -r '([.resource_changes[]?.change.actions?] | flatten)
        | {"create": (map(select(.=="create")) | length),
           "update": (map(select(.=="update")) | length),
           "delete": (map(select(.=="delete")) | length)}' plan.show.json > plan.json
  artifacts:
    paths:
      - infra/plan.tfplan
    reports:
      terraform: infra/plan.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - infra/**/*

tf-apply:
  stage: apply
  extends: .terraform
  # Manual gate = the GitHub `environment: production` approval. Protect the
  # `production` environment in Settings → CI/CD → Environments to require a
  # specific approver before this can run.
  environment:
    name: production
  script:
    - terraform plan -input=false -out=plan.tfplan
    - terraform apply -input=false plan.tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - infra/**/*
      when: manual
